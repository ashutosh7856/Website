name: Deploy React App to Cloudflare Pages

on:
  push:
    branches:
      - main 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # pnpm before Node: setup-node's `cache: 'pnpm'` needs the pnpm binary on
      # PATH to locate the store. Version comes from package.json's
      # `packageManager` field, so CI and every developer install identically.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile is the CI equivalent of `npm ci`: it refuses to update
      # pnpm-lock.yaml, so a package.json edit committed without a matching
      # lockfile fails here rather than silently resolving to something new.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application (Runs react-snap)
        run: pnpm run build
        env:
          CI: false
          # API Base URLs
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_CHATBOT_API_URL: ${{ secrets.VITE_CHATBOT_API_URL }}
          VITE_COLLEGE_SEARCH_API_URL: ${{ secrets.VITE_COLLEGE_SEARCH_API_URL }}
          VITE_NEET_COUNSELLING_API_URL: ${{ secrets.VITE_NEET_COUNSELLING_API_URL }}
          
          # Firebase Configuration
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=website --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
